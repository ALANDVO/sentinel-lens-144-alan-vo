[project]
name = "sentinel-lens-144-alan-vo"
version = "1.0.0"
description = "A coding-agent skill for multi-phase security audits with independently verified, machine-readable findings"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alan Vo", email = "alanvo@gmail.com"}]
maintainers = [{name = "Alan Vo", email = "alanvo@gmail.com"}]
keywords = [
    "security-audit",
    "ai-ml",
    "code-analysis",
    "static-analysis",
    "vulnerability-detection"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
